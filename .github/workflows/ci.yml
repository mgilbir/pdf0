name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # The conformance corpora are not vendored; corpus-gated tests skip.
        run: go test ./... -count=1

      - name: example runs
        # The README's headline example must run and produce a file (audit C9).
        run: |
          go run ./examples/simple_pdfa
          test -s output.pdf
          rm output.pdf
